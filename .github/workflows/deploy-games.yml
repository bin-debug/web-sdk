name: Deploy Games to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-games:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: skull-fiesta-frenzy
            project: skull-fiesta-frenzy
            game_id: skull_fiesta_frenzy
          - app: fruit-pop-frenzy
            project: fruit-pop-frenzy
            game_id: fruit_pop_frenzy
          - app: amapiano-after-dark
            project: amapiano-after-dark
            game_id: amapiano_after_dark
          - app: boulder-bash
            project: boulder-bash
            game_id: boulder_bash
          - app: cheerful-charlie
            project: cheerful-charlie
            game_id: cheerful_charlie
          - app: ke-dezemba
            project: ke-dezemba
            game_id: ke_dezemba
          - app: mzansi-magic
            project: mzansi-magic
            game_id: mzansi_magic
          - app: pops-and-bangs
            project: pops-and-bangs
            game_id: pops_and_bangs
          - app: shamrocks-and-shenanigans
            project: shamrocks-and-shenanigans
            game_id: shamrocks_and_shenanigans
          - app: sugar-pop-cascade
            project: sugar-pop-cascade
            game_id: sugar_pop_cascade
          - app: brimstone-bookies
            project: brimstone-bookies
            game_id: brimstone_bookies

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build pixi-svelte
        run: pnpm --filter pixi-svelte build

      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build
        env:
          PUBLIC_RGS_URL: https://website.rgs.atomic-labs.co
          PUBLIC_GAME_ID: ${{ matrix.game_id }}

      - name: Deploy ${{ matrix.app }} to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/${{ matrix.app }}/build --project-name ${{ matrix.project }} --commit-dirty=true

  deploy-router:
    runs-on: ubuntu-latest
    needs: deploy-games
    steps:
      - uses: actions/checkout@v4

      - name: Deploy game-router Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: workers/game-router
          command: deploy
