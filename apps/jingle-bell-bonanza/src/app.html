<!doctype html>
<html lang="en" class="intro-active">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preconnect" href="https://use.typekit.net" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preload" as="style" href="https://use.typekit.net/aba0ebl.css" onload="this.onload=null;this.rel='stylesheet'" />
		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Megrim&family=Jura:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
		<noscript>
			<link rel="stylesheet" href="https://use.typekit.net/aba0ebl.css" />
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Megrim&family=Jura:wght@400;500;600;700&display=swap" />
		</noscript>
		<meta name="viewport" content="width=device-width" />
		<style>
			/* Inline so it applies from the first frame: the game canvas stays hidden until the intro is dismissed. */
			html.intro-active canvas { visibility: hidden !important; }
			/* The studio loading screen. It paints and animates before the app's JavaScript has loaded;
			   IntroOverlay then drives its progress bar from the real asset loading and fades it out,
			   so there is one continuous screen instead of a static copy swapped for a live one. */
			#boot-splash { position: fixed; inset: 0; z-index: 501; display: flex; align-items: center; justify-content: center; background: #000; user-select: none; overflow: hidden; transition: opacity .45s ease; }
			#boot-splash.out { opacity: 0; pointer-events: none; }
			#boot-splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; visibility: visible !important; }
			#boot-splash .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(120,80,10,.3), rgba(0,0,0,0) 55%), radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,.85) 100%); animation: bs-breathe 5s ease-in-out infinite; }
			#boot-splash .studio-inner { position: relative; text-align: center; padding: 0 6vw; width: 100%; box-sizing: border-box; }
			#boot-splash .studio-name { font-family: 'Megrim', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.08em; font-size: clamp(2.8rem, 13vw, 8rem); line-height: 1; white-space: nowrap;
				background: linear-gradient(100deg, #8a6420 0%, #ffe9a0 30%, #fff 45%, #ffe9a0 60%, #b8862b 100%); background-size: 250% 100%;
				-webkit-background-clip: text; background-clip: text; color: transparent;
				filter: drop-shadow(0 0 1.1rem rgba(240,196,80,.45));
				-webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%); mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
				-webkit-mask-size: 260% 100%; mask-size: 260% 100%; -webkit-mask-position: 100% 0; mask-position: 100% 0; transform: translateY(0.8rem) scale(.96);
				animation: bs-shine 3.2s linear infinite, bs-reveal 1.1s cubic-bezier(.2,.8,.2,1) .1s forwards; }
			#boot-splash .studio-rule { width: 0; height: 0.14rem; margin: 1.4rem auto; background: linear-gradient(90deg, transparent, rgba(245,197,24,.95), transparent); animation: bs-draw 1s .9s ease-out forwards; }
			#boot-splash .studio-tag { font-family: 'Jura', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.34em; text-transform: uppercase; font-size: clamp(0.9rem, 3.6vw, 1.5rem); color: #eaf3f2; opacity: 0; animation: bs-tag .9s 1.3s forwards; }
			#boot-splash .pbar { position: relative; width: min(70%, 28rem); height: 0.55rem; margin: 2.4rem auto 0.8rem; border-radius: 1rem; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 0.06rem rgba(245,197,24,.4); opacity: 0; animation: bs-fade .6s 1.5s forwards; }
			#boot-splash .pbar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 1rem; overflow: hidden; transform-origin: left center; transform: scaleX(0); transition: transform .3s ease-out;
				background: linear-gradient(90deg, #8a5a12, #f5c518 70%, #fff3c4); box-shadow: 0 0 0.75rem rgba(245,197,24,.7); }
			#boot-splash .pbar-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%); background-size: 200% 100%; animation: bs-shine 1.3s linear infinite; }
			#boot-splash .pbar-head { position: absolute; top: 50%; left: 0; width: 1.2rem; height: 1.2rem; margin: -0.6rem 0 0 -0.6rem; border-radius: 50%; background: radial-gradient(circle, #fff 0, #ffe08a 30%, rgba(245,197,24,0) 70%); transition: left .3s ease-out; }
			#boot-splash .pbar-label { font-family: 'Jura', system-ui, sans-serif; font-size: 0.85rem; letter-spacing: .22em; color: #e9d9a8; opacity: 0; animation: bs-fade .6s 1.6s forwards; }
			#boot-splash .pbar-label b { font-weight: 600; color: #ffe9a0; display: inline-block; min-width: 3em; text-align: left; }
			@keyframes bs-reveal { to { -webkit-mask-position: 0 0; mask-position: 0 0; transform: none; } }
			@keyframes bs-shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
			@keyframes bs-draw { to { width: min(64%, 32rem); } }
			@keyframes bs-tag { from { opacity: 0; letter-spacing: .6em; } to { opacity: .95; letter-spacing: .34em; } }
			@keyframes bs-fade { to { opacity: 1; } }
			@keyframes bs-breathe { 50% { opacity: .6; } }
			@media (prefers-reduced-motion: reduce) { #boot-splash *, #boot-splash *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }
		</style>
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div id="boot-splash">
			<canvas id="boot-dust"></canvas>
			<div class="vig"></div>
			<div class="studio-inner">
				<div class="studio-name">Atomic-Labs</div>
				<div class="studio-rule"></div>
				<div class="studio-tag">Fortune Favours The Brave</div>
				<div class="pbar"><div class="pbar-fill" id="boot-fill"></div><div class="pbar-head" id="boot-head"></div></div>
				<div class="pbar-label">LOADING <b id="boot-pc">0%</b></div>
			</div>
		</div>
		<script>
			// Rising gold dust behind the studio name. Stops itself once the splash is removed.
			(function () {
				var c = document.getElementById('boot-dust'), x = c.getContext('2d'), d = Math.min(2, window.devicePixelRatio || 1), W, H, P = [];
				function rs() { W = c.width = c.offsetWidth * d; H = c.height = c.offsetHeight * d; }
				rs(); window.addEventListener('resize', rs);
				for (var i = 0; i < 45; i++) P.push({ x: Math.random(), y: Math.random(), r: Math.random() * 2 + .6, s: Math.random() * .0008 + .0003, p: Math.random() * 6.28 });
				function f(n) {
					if (!c.isConnected) return window.removeEventListener('resize', rs);
					var t = n / 1000; x.clearRect(0, 0, W, H);
					for (var i = 0; i < P.length; i++) {
						var q = P[i]; q.y -= q.s; if (q.y < 0) q.y = 1;
						x.globalAlpha = .3 + .35 * Math.sin(t * 2 + q.p); x.fillStyle = '#ffd778';
						x.beginPath(); x.arc((q.x + Math.sin(t * .5 + q.p) * .01) * W, q.y * H, q.r * d, 0, 6.283); x.fill();
					}
					requestAnimationFrame(f);
				}
				requestAnimationFrame(f);
			})();
		</script>
		<div>%sveltekit.body%</div>
	</body>
</html>
