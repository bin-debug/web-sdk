<!doctype html>
<html lang="en" class="intro-active">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preconnect" href="https://use.typekit.net" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preload" as="style" href="https://use.typekit.net/aba0ebl.css" onload="this.onload=null;this.rel='stylesheet'" />
		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Megrim&family=Jura:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
		<noscript>
			<link rel="stylesheet" href="https://use.typekit.net/aba0ebl.css" />
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Megrim&family=Jura:wght@400;500;600;700&display=swap" />
		</noscript>
		<meta name="viewport" content="width=device-width" />
		<style>
			/* Inline so it applies from the first frame: the game canvas stays hidden until the intro is dismissed. */
			html.intro-active canvas { visibility: hidden !important; }
			/* Static copy of IntroOverlay's studio screen, painted before the app's JavaScript has loaded. */
			.boot-studio { position: fixed; inset: 0; z-index: 499; display: flex; align-items: center; justify-content: center; background: #000; user-select: none; }
			.boot-studio .studio-inner { text-align: center; padding: 0 6vw; width: 100%; box-sizing: border-box; }
			.boot-studio .studio-name { font-family: 'Megrim', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.08em; font-size: clamp(3.6rem, 17vw, 8rem); line-height: 1; color: #ffe9a0; text-shadow: 0 0 1.8rem rgba(240,196,80,.55), 0 0.2rem 0.6rem rgba(0,0,0,.6); }
			.boot-studio .studio-rule { width: min(72%, 34rem); height: 0.14rem; margin: 1.4rem auto; background: linear-gradient(90deg, transparent, rgba(245,197,24,.9), transparent); }
			.boot-studio .studio-tag { font-family: 'Jura', system-ui, sans-serif; font-weight: 600; letter-spacing: 0.34em; text-transform: uppercase; font-size: clamp(0.95rem, 4vw, 1.6rem); color: #eaf3f2; opacity: .95; }
			.boot-studio .pbar { width: min(74%, 30rem); height: 0.8rem; margin: 2.6rem auto 0.8rem; background: rgba(255,255,255,.12); border-radius: 1rem; overflow: hidden; box-shadow: inset 0 0 0 0.08rem rgba(245,197,24,.35); }
			.boot-studio .pbar-label { font-family: 'Jura', system-ui, sans-serif; font-size: 1rem; letter-spacing: .18em; color: #cfe; opacity: .72; }
		</style>
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div id="boot-splash" class="boot-studio">
			<div class="studio-inner">
				<div class="studio-name">Atomic-Labs</div>
				<div class="studio-rule"></div>
				<div class="studio-tag">Fortune Favours The Brave</div>
				<div class="pbar"></div>
				<div class="pbar-label">Loading… 0%</div>
			</div>
		</div>
		<div>%sveltekit.body%</div>
	</body>
</html>
