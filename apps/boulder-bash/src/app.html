	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="preconnect" href="https://use.typekit.net" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Montserrat:wght@500&family=Megrim&family=Jura:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
		<noscript>
			<link rel="stylesheet" href="https://use.typekit.net/aba0ebl.css" />
			<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Montserrat:wght@500&family=Megrim&family=Jura:wght@400;500;600;700&display=swap" />
		</noscript>
		<meta name="viewport" content="width=device-width" />
		<style>
			/* Inline so it applies from the first frame: the game canvas stays hidden until the intro is dismissed. */
			html.intro-active canvas { visibility: hidden !important; }
			/* Popups (free-spin award, resume, …) wait until the player taps through the intro. */
			html.intro-active .pop-up-wrap { display: none !important; }

			/* Platinum colourway: white logo on midnight navy. */
			:root { --bg1: #1b2230; --bg2: #0b0e15; --bg3: #030406; --glow: rgba(190,215,255,.34); --ray: rgba(220,232,255,.06); --ember: 225,235,255; --ember2: 160,200,255; --segglow: rgba(200,225,255,.75); --accent: #cfe0ff; --burst: rgba(215,230,255,.8); }

			/* Studio loading screen. Painted from the first frame; IntroOverlay drives it through window.__boot.
			   Entrance motion is transform/opacity on HTML layers only, so it runs on the compositor and keeps
			   playing while the game's JavaScript is busy loading. */
			#boot-splash {
				--p: 0;
				position: fixed; inset: 0; z-index: 501; overflow: hidden; user-select: none;
				display: flex; align-items: center; justify-content: center;
				background: radial-gradient(120% 85% at 50% 34%, var(--bg1) 0%, var(--bg2) 42%, var(--bg3) 100%);
				transition: opacity .7s ease .25s;
			}
			#boot-splash.bs-done { opacity: 0; pointer-events: none; }
			#boot-splash canvas { visibility: visible !important; }
			.bs-fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
			.bs-rays {
				position: absolute; left: 50%; top: 34%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax;
				background: repeating-conic-gradient(from 0deg, var(--ray) 0deg 4deg, transparent 4deg 15deg);
				-webkit-mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 22%, transparent 52%);
				mask: radial-gradient(circle, #000 0%, rgba(0,0,0,.5) 22%, transparent 52%);
				animation: bs-spin 40s linear infinite, bs-in 1.6s ease-out both;
			}
			.bs-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%); }
			.bs-stage { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; padding: 0 6vw; box-sizing: border-box; }

			/* Logo: three stacked layers sharing one viewBox. The chip ring is the progress bar. */
			.bs-logo { position: relative; width: min(56vw, 38vh, 310px); aspect-ratio: 1208 / 1300; animation: bs-float 4.5s ease-in-out 2.2s infinite; }
			.bs-logo::before {
				content: ''; position: absolute; left: 50%; top: 55%; width: 175%; aspect-ratio: 1; transform: translate(-50%, -50%);
				background: radial-gradient(circle, var(--glow) 0%, transparent 60%);
				animation: bs-glow 3.2s ease-in-out 1.6s infinite, bs-in 1.2s ease-out .2s both;
			}
			.bs-l { position: absolute; inset: 0; will-change: transform, opacity; }
			.bs-l svg { display: block; width: 100%; height: 100%; overflow: visible; }
			.bs-l path { fill: url(#bsWhite); }
			.bs-l-chip { transform-origin: 49.7% 55.4%; animation: bs-chip-in 1.1s cubic-bezier(.2,.9,.25,1.15) both; }
			.bs-l-chip svg { filter: drop-shadow(0 0 10px var(--segglow)); }
			.bs-l-card { transform-origin: 49.7% 64.3%; animation: bs-card-in .8s cubic-bezier(.3,1.5,.5,1) .35s both; }
			.bs-l-crown { transform-origin: 49.7% 29%; animation: bs-crown-in .75s cubic-bezier(.3,1.6,.45,1) 1s both; }
			.bs-l .bs-seg { opacity: clamp(.13, calc(var(--p) * 12.5 - var(--i)), 1); }
			.bs-l .bs-seg { fill: url(#bsSegPlatinum); }
			.bs-l .bs-shine { fill: url(#bsShine); }
			.bs-ring {
				position: absolute; left: 50%; top: 14%; width: 46%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%) scale(.2);
				box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 30px 8px var(--segglow); opacity: 0;
				animation: bs-ring .8s ease-out 1.42s both;
			}

			/* Studio name: letters drop in one by one. */
			.bs-name {
				margin-top: clamp(1.1rem, 3.6vh, 2.2rem); white-space: nowrap;
				font-family: 'Unbounded', 'Arial Black', system-ui, sans-serif; font-weight: 800; text-transform: uppercase;
				font-size: clamp(1.55rem, 8.4vw, 3.3rem); letter-spacing: .08em; line-height: 1; color: #fff;
				text-shadow: 0 0 28px var(--segglow), 0 2px 0 rgba(0,0,0,.35);
			}
			.bs-name span { display: inline-block; animation: bs-letter .6s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(1.35s + var(--i) * 45ms); }
			.bs-tag {
				display: flex; align-items: center; gap: .7em; margin-top: clamp(.7rem, 2vh, 1.2rem); white-space: nowrap;
				font-family: 'Montserrat', system-ui, sans-serif; font-weight: 500;
				font-size: clamp(.85rem, 3.7vw, 1.3rem); letter-spacing: .06em; line-height: 1.1; color: rgba(225,233,248,.74);
				text-shadow: 0 2px 8px rgba(0,0,0,.5);
				animation: bs-rise .9s cubic-bezier(.2,.8,.2,1) 2s both;
			}
			.bs-tag::before, .bs-tag::after { content: ''; width: clamp(1.4rem, 8vw, 3.5rem); height: 1px; background: linear-gradient(90deg, transparent, var(--accent)); }
			.bs-tag::after { transform: scaleX(-1); }
			.bs-pct { margin-top: clamp(1.4rem, 4.5vh, 2.6rem); font-family: 'Jura', system-ui, sans-serif; font-weight: 600; font-size: clamp(.72rem, 2.6vw, .88rem); letter-spacing: .42em; color: var(--accent); opacity: .85; font-variant-numeric: tabular-nums; animation: bs-in .8s ease-out .6s both; }
			.bs-pct b { color: #fff; font-weight: 700; }

			/* Finish: flash burst, logo punch, then the splash fades over the logo screen. */
			.bs-burst { position: absolute; left: 50%; top: 34%; width: 60vmax; height: 60vmax; margin: -30vmax 0 0 -30vmax; border-radius: 50%; pointer-events: none; opacity: 0; background: radial-gradient(circle, #fff 0%, var(--burst) 18%, transparent 62%); }
			.bs-done .bs-burst { animation: bs-burst .9s cubic-bezier(.1,.7,.3,1) both; }
			.bs-done .bs-logo { animation: bs-punch .7s cubic-bezier(.2,1.4,.4,1) both; }
			.bs-done .bs-stage > :not(.bs-logo) { transition: opacity .3s; opacity: 0; }

			@keyframes bs-in { from { opacity: 0; } }
			@keyframes bs-spin { to { transform: rotate(360deg); } }
			@keyframes bs-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
			@keyframes bs-glow { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
			@keyframes bs-chip-in { from { opacity: 0; transform: scale(.35) rotate(-140deg); } 60% { opacity: 1; } }
			@keyframes bs-card-in { from { opacity: 0; transform: scaleX(0) scaleY(.7); } 40% { opacity: 1; } }
			@keyframes bs-crown-in { from { opacity: 0; transform: translateY(-45%) scale(.8); } 50% { opacity: 1; } }
			@keyframes bs-ring { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2.6); } }
			@keyframes bs-letter { from { opacity: 0; transform: translateY(-60%) scale(1.6); } }
			@keyframes bs-rise { from { opacity: 0; transform: translateY(12px); } }
			@keyframes bs-burst { 0% { opacity: 1; transform: scale(.1); } 100% { opacity: 0; transform: scale(2.2); } }
			@keyframes bs-punch { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1.06); } }
			@media (max-height: 500px) {
				.bs-logo { width: min(30vw, 32vh, 200px); }
				.bs-name { margin-top: .7rem; font-size: clamp(1.2rem, 4vw, 2rem); }
				.bs-pct { margin-top: .9rem; }
			}
			@media (prefers-reduced-motion: reduce) {
				#boot-splash *, #boot-splash *::before, #boot-splash *::after { animation: none !important; }
			}
		</style>

		<script>
			// Drives the studio screen until IntroOverlay takes over: embers, smoothed progress, finish burst.
			// IntroOverlay times its progress from __boot.t0 (when this screen started), calls
			// window.__boot.set(0..1) while loading and window.__boot.finish() at 100%.
			(function () {
				var el = document.getElementById('boot-splash');
				if (!el) return;
				var cv = el.querySelector('.bs-fx'), ctx = cv.getContext('2d'), pct = el.querySelector('.bs-pct b');
				var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
				var dpr = Math.min(window.devicePixelRatio || 1, 2), W = 0, H = 0, parts = [], target = 0, shown = 0, t0 = 1e12, last = 0, alive = true;

				// Studio name letters animate individually.
				var name = el.querySelector('.bs-name'), letters = name.textContent.trim();
				name.textContent = '';
				for (var k = 0; k < letters.length; k++) {
					var sp = document.createElement('span');
					sp.textContent = letters[k] === ' ' ? ' ' : letters[k];
					sp.style.setProperty('--i', k);
					name.appendChild(sp);
				}

				var css = getComputedStyle(document.documentElement);
				function glowSprite(rgb) {
					var c = document.createElement('canvas'); c.width = c.height = 64;
					var g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
					gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(' + rgb + ',.85)'); gr.addColorStop(.6, 'rgba(' + rgb + ',.22)'); gr.addColorStop(1, 'rgba(' + rgb + ',0)');
					g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
					return c;
				}
				var sprites = [glowSprite(css.getPropertyValue('--ember').trim() || '255,255,255'), glowSprite(css.getPropertyValue('--ember2').trim() || '255,255,255')];

				function resize() { W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }
				function ember(y) { return { x: Math.random() * W, y: y == null ? H + 20 : y, vx: (Math.random() - .5) * 12 * dpr, vy: -(18 + Math.random() * 55) * dpr, s: (Math.random() < .12 ? 30 + Math.random() * 40 : 7 + Math.random() * 20) * dpr, ph: Math.random() * 6.28, a: .35 + Math.random() * .65, img: sprites[Math.random() < .7 ? 0 : 1], life: 1e9 }; }
				resize(); addEventListener('resize', resize);
				var n = still ? 0 : Math.max(45, Math.min(110, Math.round(innerWidth * innerHeight / 7000)));
				for (var i = 0; i < n; i++) parts.push(ember(Math.random() * H));

				function frame(now) {
					if (!alive || !el.isConnected) return;
					// CSS animations start on the first rendered frame, so the clock starts here too.
					if (t0 > now) { t0 = last = now; window.__boot.t0 = now; }
					var dt = Math.min(.05, (now - last) / 1000); last = now;
					target = Math.max(target, .3 * (1 - Math.exp(-(now - t0) / 1500))); // until the app reports real progress
					shown += (target - shown) * Math.min(1, dt * 7);
					if (target - shown < .002) shown = target;
					el.style.setProperty('--p', shown.toFixed(4));
					pct.textContent = Math.round(shown * 100);

					ctx.clearRect(0, 0, W, H);
					ctx.globalCompositeOperation = 'lighter';
					for (var i = parts.length - 1; i >= 0; i--) {
						var q = parts[i];
						q.ph += dt * 2; q.x += (q.vx + Math.sin(q.ph) * 14 * dpr) * dt; q.y += q.vy * dt; q.life -= dt;
						if (q.burst) { q.vx *= 1 - dt * 1.6; q.vy = q.vy * (1 - dt * 1.6) - 30 * dpr * dt; }

						ctx.globalAlpha = q.a * (q.burst ? Math.min(1, q.life * 1.5) : .6 + .4 * Math.sin(q.ph * 3));
						ctx.drawImage(q.img, q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
					}
					ctx.globalAlpha = 1;
					requestAnimationFrame(frame);
				}

				window.__boot = {
					t0: t0, // set on the first frame
					set: function (p) { target = Math.max(target, Math.min(1, p)); },
					finish: function () {
						target = 1;
						return new Promise(function (resolve) {
							setTimeout(function () {
								shown = 1;
								el.style.setProperty('--p', 1);
								el.classList.add('bs-done');
								if (!still) {
									var r = el.querySelector('.bs-logo').getBoundingClientRect(), cx = (r.left + r.width / 2) * dpr, cy = (r.top + r.height / 2) * dpr;
									for (var i = 0; i < 140; i++) {
										var a = Math.random() * 6.28, v = (120 + Math.random() * 520) * dpr;
										parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, s: (6 + Math.random() * 16) * dpr, ph: Math.random() * 6.28, a: .6 + Math.random() * .4, img: sprites[i % 2], life: .6 + Math.random() * .7, burst: true });
									}
								}
								setTimeout(resolve, 250);
								setTimeout(function () { alive = false; el.remove(); }, 1100);
							}, 350);
						});
					}
				};
				requestAnimationFrame(frame);
			})();
